name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test
        shell: powershell
        run: .\build.ps1 -Test

      - name: Verify build output
        shell: powershell
        run: |
          Get-ChildItem -LiteralPath . -Force
          Get-ChildItem -LiteralPath .\dist -Force
          if (-not (Test-Path -LiteralPath '.\dist\Inkveil.exe')) {
            throw 'Inkveil.exe was not produced.'
          }

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: Inkveil
          path: |
            ${{ github.workspace }}/dist/Inkveil.exe
            ${{ github.workspace }}/dist/Inkveil.exe.config
          if-no-files-found: error
